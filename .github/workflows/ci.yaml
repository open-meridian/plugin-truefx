# Plugins are CI-first (ruled 2026-10-13): a change lands through a pull
# request, and this run, with check.yaml's and e2e.yaml's, is its gate. A push
# straight to main runs `make ci-local` first, in the pre-push hook.
#
# The job is named for the make target it runs. It runs ci-remote rather than
# ci-local: check.yaml takes `make check`'s steps and e2e.yaml `make e2e`'s
# (which builds the plugin's image).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make ci-remote
        run: make ci-remote
