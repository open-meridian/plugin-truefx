[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truefx"
version = "0.2.0"
description = "TrueFX's FX rates in an Open Meridian deployment's lake: a data plugin"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else, pinned exactly: the sidecar this runs beside speaks
# one version of the contract, and a range would let a rebuild pick up
# another. The Dockerfile's base is the same version. TrueFX is reached with
# the standard library's HTTP client, so there is no third-party dependency.
dependencies = [
  "open-meridian==0.31.0",
]

[project.urls]
Repository = "https://github.com/open-meridian/plugin-truefx"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
truefx = "truefx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pages' templates and the synthetic feed, installed beside the code that
# reads them.
[tool.setuptools.package-data]
truefx = ["templates/*.html", "synthetic/*.csv", "synthetic/history/*.csv"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list -- compliance, confirmation,
# connectivity, custody, data, ems, oms, operations, portfolio, reporting,
# servicing, settlement, signal -- and its grants are theirs. `data`: it puts
# TrueFX's rates into the lake, converted at the edge, and keeps TrueFX's raw
# responses in its own storage (W10, contracts v18 to v20).
roles = ["data"]
# Whether it serves a page through its sidecar.
interface = true
# Its whole declaration (contract v25): its catalogue, the storage it asks
# for its raw responses, its settings, its pages and their tools, and docs/.
# Upload reads it from the built image with `meridian-declaration`.
declaration = "truefx.declaration:DECLARATION"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["truefx"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# The SDK's gRPC stubs have no types (meridian-python's own configuration
# says the same).
[[tool.mypy.overrides]]
module = [
    "meridian.v1.sidecar_pb2_grpc",
    "meridian.v1.envelope_pb2_grpc",
    "meridian.plugin.v1.operations_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
